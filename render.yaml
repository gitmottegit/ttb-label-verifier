# One-click deploy on Render: https://render.com/docs/blueprints
services:
  - type: web
    name: ttb-label-verifier
    runtime: python
    plan: starter  # always-on instance — no cold starts during review
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # set in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.12"
